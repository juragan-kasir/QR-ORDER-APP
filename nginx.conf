server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # compress JS/CSS/JSON/SVG
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # same as the "rewrites" in vercel.json: every route serves index.html so
  # react-router handles it (otherwise a refresh on /menu would be a 404)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # never cache index.html, otherwise after a redeploy the browser keeps an
  # old index.html that points at JS files no longer in the image → blank page
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Vite build files have a hash in their name, safe to cache for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
